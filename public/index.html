<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shelf">
<meta name="theme-color" content="#F1F2EE">
<meta name="description" content="Track your skincare and beauty products and know what's running low before you run out.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --ink:#1D2A31; --muted:#66737B; --faint:#98A3A9; --line:#DCE0DB;
  --teal:#2E6A64; --teal-d:#23514C; --teal-t:#E3EDEA;
  --ok:#7DA597; --low:#C68B2B; --out:#B0495B; --empty:#E7EAE5;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* header */
header{padding:calc(env(safe-area-inset-top,0px) + 18px) 0 6px}
.top{display:flex;align-items:center;gap:10px}
.wordmark{font-family:var(--serif);font-size:30px;line-height:1;margin:0;letter-spacing:-.01em}
.top .sp{flex:1}
.planbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.planbtn.pro{background:var(--teal);border-color:var(--teal);color:#fff}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:19px;height:19px}

/* hero: the shelf strip */
.strip{margin:18px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px}
.vials{display:flex;align-items:flex-end;gap:9px;overflow-x:auto;padding:4px 2px 0;scrollbar-width:none;min-height:86px}
.vials::-webkit-scrollbar{display:none}
.vial{flex:0 0 auto;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.vial .v{width:20px;border-radius:10px 10px 6px 6px;background:var(--empty);position:relative;overflow:hidden}
.vial .v i{position:absolute;left:0;right:0;bottom:0;display:block;transition:height .5s ease}
.vial .cap{width:12px;height:6px;border-radius:3px 3px 0 0;background:#C9CFCA;margin-bottom:1px}
.vial.unknown .v{background:repeating-linear-gradient(135deg,#EEF0EC 0 4px,#E3E6E1 4px 8px)}
.plank{height:6px;border-radius:3px;background:#D5D9D2;margin:0 -4px}
.summary{margin:12px 2px 0;font-size:14.5px;color:var(--muted)}
.summary b{color:var(--ink);font-weight:700}
@media (prefers-reduced-motion:reduce){.vial .v i{transition:none}}

/* tabs */
.seg{display:flex;background:#E4E7E2;border-radius:12px;padding:3px;margin:16px 0 10px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,42,49,.08)}
.seg .n{font-weight:500;color:var(--faint);margin-left:4px}

/* controls */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.ghost{border-style:dashed}
.sortrow{display:flex;align-items:center;gap:10px;margin:10px 0 4px;font-size:13.5px;color:var(--muted)}
.sortrow select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--ink)}

/* product list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
.prow{display:grid;grid-template-columns:48px 1fr 22px;gap:13px;align-items:center;padding:13px 14px;border:none;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.prow:first-child{border-top:none}
.prow.off{opacity:.55}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#EEF0EC;display:grid;place-items:center}
.pname{display:block;font-family:var(--serif);font-size:16.5px;line-height:1.25;overflow-wrap:anywhere}
.pbrand{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.pstat{display:block;font-size:13px;margin-top:4px;font-weight:600}
.pstat.ok{color:var(--teal)} .pstat.low{color:var(--low)} .pstat.out{color:var(--out)} .pstat.none{color:var(--faint);font-weight:500}
.flag{display:inline-block;font-size:12px;font-weight:700;color:var(--out);margin-left:8px}
.gauge{width:14px;height:42px;border-radius:7px;background:var(--empty);position:relative;overflow:hidden;justify-self:end}
.gauge i{position:absolute;left:0;right:0;bottom:0}
.gauge.unknown{background:repeating-linear-gradient(135deg,#EEF0EC 0 3px,#E3E6E1 3px 6px)}
.grp{font-family:var(--serif);font-size:18px;margin:22px 2px 2px;font-weight:400}
.grp small{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:6px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:none}
.lrow .acts{display:flex;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.sbtn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.empty{text-align:left;padding:22px 18px;color:var(--muted)}
.empty h2{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink);margin:0 0 6px}
.empty .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.teaser{background:var(--teal-t);border:1px solid #CFE0DB;border-radius:var(--r);padding:14px 16px;margin:14px 0;font-size:14px;color:var(--teal-d)}
.teaser button{margin-top:10px}
.cap-note{font-size:13px;color:var(--muted);margin:8px 2px}
.cap-note button{border:none;background:none;color:var(--teal);font-weight:700;padding:0;text-decoration:underline}

/* fab */
.fab{position:fixed;right:max(18px,calc(50vw - 342px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;
  border:none;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(35,81,76,.32);z-index:30}
.fab svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(29,42,49,.38);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:#C9CFCA;margin:0 auto 12px}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:4px 0 4px;line-height:1.2}
.sheet .lead{color:var(--muted);margin:0 0 14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 2px 5px}
.in,.sheet select,.sheet textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;font-size:16px}
.sheet textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin:14px 2px 0;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--teal)}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.actions{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-weight:700;font-size:15px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{flex:0 0 auto;color:var(--out)}
.btn:disabled{opacity:.55}
.btn.block{width:100%;flex:none;display:block;margin-top:10px}
.photo{display:flex;align-items:center;gap:14px}
.photo .ph{width:72px;height:72px;border-radius:14px;background:#E7EAE5;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.photo .ph img{width:100%;height:100%;object-fit:cover}
.stars{display:flex;gap:4px}
.stars button{border:none;background:none;padding:2px;font-size:26px;line-height:1;color:#CBD1CD}
.stars button.on{color:var(--low)}
.pro-pill{display:inline-block;font-size:11.5px;font-weight:700;color:var(--teal);background:var(--teal-t);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.lockbox{border:1px dashed #BFD2CC;background:var(--teal-t);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--teal-d);width:100%;text-align:left}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:15px 16px;margin-top:10px}
.choice .ci{width:42px;height:42px;border-radius:12px;background:var(--teal-t);color:var(--teal);display:grid;place-items:center;flex:0 0 auto}
.choice .ci svg{width:22px;height:22px}
.choice b{display:block;font-size:15.5px}
.choice span{font-size:13.5px;color:var(--muted)}

/* paywall */
.pw-head{font-family:var(--serif);font-size:28px;line-height:1.15;margin:6px 0 8px}
.pw-reason{color:var(--muted);margin:0 0 14px}
.benefits{list-style:none;padding:0;margin:0 0 16px}
.benefits li{padding:7px 0 7px 28px;position:relative;border-top:1px solid var(--line)}
.benefits li:first-child{border-top:none}
.benefits li::before{content:"";position:absolute;left:4px;top:12px;width:10px;height:14px;border-radius:5px 5px 3px 3px;
  background:linear-gradient(to top,var(--ok) 60%,var(--empty) 60%)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 12px;text-align:left}
.plan.on{border-color:var(--teal)}
.plan b{display:block;font-size:15px}
.plan .price{font-family:var(--serif);font-size:22px;margin-top:2px}
.plan small{color:var(--muted);font-size:12.5px}
.fine{font-size:12.5px;color:var(--muted);margin:10px 2px 0;text-align:center}
.linkbtn{border:none;background:none;color:var(--teal);font-weight:700;padding:6px 0;text-decoration:underline;font-size:14px}

/* settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.card h3{margin:0 0 4px;font-size:15px}
.card p{margin:0;color:var(--muted);font-size:14px}
.meter{height:8px;border-radius:4px;background:var(--empty);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal)}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:#F4F5F2;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;max-height:84px;overflow:auto}

/* scan */
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.shots div{position:relative}
.shots img{width:76px;height:76px;border-radius:12px;object-fit:cover;display:block}
.shots button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:14px;line-height:1;padding:0}
.found{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 2px;border-top:1px solid var(--line);align-items:start}
.found input{width:20px;height:20px;margin-top:3px;accent-color:var(--teal)}
.found .pname{font-size:16px}
.status{font-size:14px;color:var(--muted);margin-top:12px;min-height:20px}
.status.err{color:var(--out)}

/* categories */
.catrow{display:flex;align-items:center;gap:12px;width:100%;border:none;border-top:1px solid var(--line);background:none;padding:12px 2px;text-align:left}
.catrow:first-child{border-top:none}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.ipick{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ipick.on{border-color:var(--ink)}
.cpick{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0}
.cpick.on{box-shadow:0 0 0 2.5px var(--ink)}

/* status pills, social */
.segs{display:flex;background:#E4E7E2;border-radius:11px;padding:3px}
.segs button{flex:1;border:none;background:none;border-radius:8px;padding:9px 4px;font-weight:600;color:var(--muted);font-size:14px}
.segs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,42,49,.08)}
.star-b{display:inline-block;font-size:12px;font-weight:700;color:var(--low);margin-left:8px}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pics div{position:relative}
.pics img{width:72px;height:72px;border-radius:12px;object-fit:cover;display:block}
.pics button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:14px;line-height:1;padding:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--teal-t);color:var(--teal-d);display:grid;place-items:center;font-family:var(--serif);font-size:19px;flex:0 0 auto}
.av.lg{width:64px;height:64px;font-size:28px}
.frow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:none;padding:13px 14px}
.frow:first-child{border-top:none}
.fhead{display:flex;gap:14px;align-items:center;margin:18px 0 6px}
.fhead h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.fhead p{margin:3px 0 0;color:var(--muted);font-size:14px}
.back{border:none;background:none;color:var(--teal);font-weight:700;padding:14px 0 0;font-size:14.5px}
.disc{font-size:12.5px;color:var(--faint);margin:14px 2px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:baseline;padding:11px 14px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:none}
.steps .n{font-family:var(--serif);color:var(--faint);font-size:15px}
.rstep{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 2px;border-top:1px solid var(--line)}
.rstep .acts{display:flex;gap:4px}
.rstep .acts button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0;font-size:15px}
.review{font-size:14.5px;margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.linkrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.linkrow input{flex:1;min-width:0;border:1px solid var(--line);background:#F4F5F2;border-radius:10px;padding:9px 10px;font-size:13.5px;color:var(--muted)}
/* visual shelf */
.views{display:flex;gap:6px;margin:14px 0 2px}
.views button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;font-size:13.5px;color:var(--muted)}
.views button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cabinet{background:linear-gradient(180deg,#EEF0EB,#E5E8E2);border:1px solid var(--line);border-radius:20px;padding:4px 0 10px;margin:12px 0;box-shadow:inset 0 2px 10px rgba(29,42,49,.05)}
.shelf-lbl{font-family:var(--serif);font-size:16.5px;margin:16px 20px 0;display:flex;align-items:baseline;gap:8px}
.shelf-lbl small{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.rack{overflow-x:auto;scrollbar-width:none;padding:0 12px;scroll-snap-type:x proximity}
.rack::-webkit-scrollbar{display:none}
.rack-in{display:inline-flex;align-items:flex-start;gap:4px;min-width:100%;padding:12px 6px 4px;
  background:linear-gradient(#DCC6A3,#C9AD84) no-repeat 0 118px/100% 11px, linear-gradient(rgba(70,48,24,.16),rgba(70,48,24,0)) no-repeat 0 129px/100% 9px}
.bt{flex:0 0 auto;width:70px;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;scroll-snap-align:start}
.bt .stage{position:relative;height:106px;display:flex;align-items:flex-end;justify-content:center;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.bt:hover .stage{transform:translateY(-3px)}
.bt.sel .stage{transform:translateY(-12px) scale(1.06)}
.bt.sel .stage::after{content:"";position:absolute;bottom:-6px;left:50%;width:46px;height:8px;margin-left:-23px;border-radius:50%;background:radial-gradient(rgba(46,106,100,.45),transparent 70%)}
.bt.off .stage{opacity:.42;filter:grayscale(.6)}
.bt .lbl{margin-top:20px;font-size:11.5px;line-height:1.25;color:var(--ink);text-align:center;width:66px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt .lbl .st{color:var(--low)}
.bt .warn{position:absolute;top:2px;right:4px;width:11px;height:11px;border-radius:50%;border:2px solid #F3F4F0;z-index:1}
.bt .warn.low{background:var(--low)} .bt .warn.out{background:var(--out)}
.peek{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(calc(100vw - 24px),520px);background:var(--surface);border:1px solid var(--line);
  border-radius:20px;box-shadow:0 18px 44px rgba(29,42,49,.24);padding:14px 16px 14px;z-index:40;display:none;transform:translateX(-50%)}
.peek.on{display:block;animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(46px) scale(.55) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1) rotate(0)}}
.peek .ptop{display:grid;grid-template-columns:38px 1fr 34px;gap:12px;align-items:center}
.peek .pv{display:flex;justify-content:center}
.peek .px{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:19px;line-height:1;padding:0;align-self:start}
.pstars{color:var(--low);margin:8px 0 0;font-size:16px;letter-spacing:1px}
body.peeking .fab{display:none}
body.reelview .fab{right:auto;left:max(18px,calc(50vw - 342px))}
.wheel-wrap{position:relative;width:min(100%,380px);aspect-ratio:1;margin:22px auto 6px;container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none}
.rim{position:absolute;inset:0;border-radius:50%;background:#23514C;box-shadow:0 14px 30px rgba(29,42,49,.22),inset 0 0 0 3px #1B403C}
.bulb{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#F7E7B5;box-shadow:0 0 6px rgba(247,231,181,.9)}
.wheel-wrap.spinning .bulb:nth-child(odd){animation:twinkle .28s steps(2) infinite}
.wheel-wrap.spinning .bulb:nth-child(even){animation:twinkle .28s steps(2) .14s infinite}
@keyframes twinkle{50%{background:#C68B2B;box-shadow:none}}
.wheel{position:absolute;inset:16px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 0 24px rgba(29,42,49,.12);cursor:grab}
.wheel:active{cursor:grabbing}
.wb{position:absolute;left:50%;top:50%;width:0;height:0}
.wbb{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border:none;background:none;padding:0;width:calc(var(--bh)/2);height:var(--bh);display:block}
.wbb svg{width:100%;height:100%}
.pointer{position:absolute;left:50%;top:-6px;width:30px;height:38px;margin-left:-15px;z-index:3;transform-origin:50% 8px;
  background:#C68B2B;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.wheel-wrap.spinning .pointer{animation:tick .11s ease-in-out infinite alternate}
@keyframes tick{from{transform:rotate(-14deg)}to{transform:rotate(6deg)}}
.hub{position:absolute;left:50%;top:50%;width:26cqw;height:26cqw;margin:-13cqw 0 0 -13cqw;border-radius:50%;border:5px solid #F3EEE3;background:var(--ink);color:#fff;
  font-family:var(--serif);font-size:6cqw;z-index:2;box-shadow:0 6px 16px rgba(29,42,49,.3)}
.hub:active{transform:scale(.96)}
.wctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 4px}
.lookrow{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.lookprev{height:104px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#DCC6A3,#C9AD84) no-repeat 0 100%/100% 8px;padding-bottom:8px}
#dShapes .ipick{width:44px;height:52px}
@media (prefers-reduced-motion:reduce){.peek.on{animation:none}.bt .stage{transition:none}.wheel-wrap.spinning .bulb,.wheel-wrap.spinning .pointer{animation:none}}
/* reel */
.reel{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:6px;height:min(62vh,540px);margin:14px -18px 8px 0}
@media (min-width:721px){.reel{margin-right:calc((684px - 100vw) / 2)}}
html{overflow-x:clip}
.reel-info{overflow:hidden;display:flex;align-items:center;padding:4px 6px 4px 0}
.rcard{width:100%}
.rcard.slot-up{animation:slotUp .4s cubic-bezier(.2,1.35,.4,1)}
.rcard.slot-down{animation:slotDown .4s cubic-bezier(.2,1.35,.4,1)}
.rcard.slot-in{animation:pop2 .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes slotUp{from{opacity:0;transform:translateY(44px)}to{opacity:1;transform:none}}
@keyframes slotDown{from{opacity:0;transform:translateY(-44px)}to{opacity:1;transform:none}}
@keyframes pop2{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.rhero{height:122px;display:flex;align-items:flex-end;padding:0 0 7px 10px;background:linear-gradient(#DCC6A3,#C9AD84) no-repeat 0 100%/86px 8px}
.rname{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.15;margin:8px 0 3px;overflow-wrap:anywhere}
.rcard .meter{max-width:180px}
.rrev{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--muted)}
.rpos{font-size:12.5px;color:var(--faint);margin:10px 0 0}
.reel-track{position:relative;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;perspective:700px;outline-offset:-3px;
  background:linear-gradient(90deg,rgba(70,48,24,0) calc(100% - 22px),rgba(70,48,24,.14) calc(100% - 13px),#C9AD84 calc(100% - 12px),#DCC6A3);
  -webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.reel-track::-webkit-scrollbar{display:none}
.reel-pad{height:calc(50% - 34px)}
.ri{position:relative;display:flex;justify-content:flex-end;align-items:center;width:100%;height:68px;border:none;background:none;padding:0 12px 0 0;scroll-snap-align:center;transform-origin:100% 50%;will-change:transform}
.ri .rb{position:relative;display:block;width:96px;height:48px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.ri .rb svg{position:absolute;left:24px;top:-24px;transform:rotate(-90deg)}
.ri.on .rb{transform:translateX(-20px) scale(1.08)}
.ri.off .rb{opacity:.45;filter:grayscale(.6)}
.rwarn{position:absolute;left:4px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%}
.rwarn.low{background:var(--low)} .rwarn.out{background:var(--out)}
.payline{position:absolute;right:136px;top:50%;margin-top:-9px;width:0;height:0;border:9px solid transparent;border-left:12px solid #C68B2B;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));pointer-events:none}
@media (prefers-reduced-motion:reduce){.rcard{animation:none!important}.ri .rb{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:80;max-width:90vw;text-align:center}
body.viewing .fab{display:none}
.sheet.on ~ .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:600px){ .wordmark{font-size:34px} .vial .v{width:22px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 class="wordmark">Shelf</h1>
      <span class="sp"></span>
      <button class="planbtn" id="planBtn" onclick="planClick()">Try Pro</button>
      <button class="iconbtn" aria-label="Settings" onclick="openSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="main"></main>
</div>

<button class="fab" aria-label="Add a product" onclick="openAdd()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="peek" id="peek" role="dialog" aria-label="Product details"></div>
<input type="file" id="fileAny" style="display:none">

<script>
"use strict";
/* ================= constants ================= */
const FREE_LIMIT = 20;
const PRICES = { yearly: { label: "Yearly", price: "$19.99", per: "a year", sub: "About $1.67 a month. Save 58%" },
                 monthly:{ label: "Monthly", price: "$3.99", per: "a month", sub: "Billed monthly" } };
const TRIAL_DAYS = 7;
const KEY = "shelf.v1", LKEY = "shelf.license", EKEY = "shelf.ent";
const SHARE_PATH = (location.pathname.match(/^\/s\/([A-Za-z0-9]{6,20})\/?$/)||[])[1] || null;
const DEV_PRO = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).get("pro") === "1";

const ICONS = {
  face:'<circle cx="12" cy="12" r="8.3"/><circle cx="9.3" cy="10.6" r="1" fill="currentColor" stroke="none"/><circle cx="14.7" cy="10.6" r="1" fill="currentColor" stroke="none"/><path d="M8.7 14.4c1.5 1.7 5.1 1.7 6.6 0"/>',
  hair:'<path d="M8 3.5c-2 3.2 1.8 5 0 8.2S9.6 16.8 8 20.5"/><path d="M12.5 3.5c-2 3.2 1.8 5 0 8.2S14.1 16.8 12.5 20.5"/><path d="M17.4 4.5c-1.3 2.4 1 3.8 0 6"/>',
  body:'<circle cx="12" cy="6" r="3.1"/><path d="M6 20.5c0-4 2.7-6.8 6-6.8s6 2.8 6 6.8"/>',
  lipstick:'<rect x="9" y="12.2" width="6" height="8.6" rx="1.1"/><path d="M10.4 12.2V7c0-1.7 3.2-2.6 3.2-.6v5.8"/>',
  capsule:'<rect x="3" y="9" width="18" height="6" rx="3"/><path d="M12 9v6"/>',
  sparkle:'<path d="M12 3.2l1.9 5.7 5.7 1.4-5.7 1.9L12 17.8l-1.9-5.6-5.7-1.9 5.7-1.4z"/>',
  drop:'<path d="M12 3.4c3 3.7 5.2 6.2 5.2 9a5.2 5.2 0 1 1-10.4 0c0-2.8 2.2-5.3 5.2-9z"/>',
  flower:'<circle cx="12" cy="6.6" r="2.6"/><circle cx="17.4" cy="12" r="2.6"/><circle cx="12" cy="17.4" r="2.6"/><circle cx="6.6" cy="12" r="2.6"/><circle cx="12" cy="12" r="1.9"/>',
  bottle:'<path d="M10 3.6h4v2.9l2.2 3v10.9a1 1 0 0 1-1 1H8.8a1 1 0 0 1-1-1V9.5L10 6.5z"/>',
  leaf:'<path d="M4.6 19.4C4.6 11 11 5.6 19.4 5.1c.5 8.4-5 14.9-14 14.3z"/><path d="M4.6 19.4 12 12"/>'
};
const CAT_COLORS = ["#2E6A64","#B06F1E","#6D4FB0","#B0495B","#23809A","#4E7D3A","#B8447F","#46509E","#8A6A4B","#56646C"];
function defaultCats(){ return [
  {name:"Skincare",icon:"face",color:"#2E6A64",subtypes:["Cleanser","Toner","Serum","Moisturizer","Eye care","Mask","Exfoliant","SPF"]},
  {name:"Hair",icon:"hair",color:"#B06F1E",subtypes:["Shampoo","Conditioner","Leave-in","Deep conditioner","Oil/Serum","Styler","Treatment"]},
  {name:"Body",icon:"body",color:"#6D4FB0",subtypes:["Wash","Lotion","Oil","Scrub","SPF","Deodorant"]},
  {name:"Makeup",icon:"lipstick",color:"#B8447F",subtypes:["Primer","Foundation","Concealer","Powder","Blush","Bronzer","Highlighter","Brow","Eyeshadow","Eyeliner","Mascara","Lip","Setting spray"]},
  {name:"Fragrance",icon:"flower",color:"#46509E",subtypes:["Perfume","Body mist","Solid"]},
  {name:"Supplements",icon:"capsule",color:"#4E7D3A",subtypes:["Capsule","Powder","Gummy","Liquid"]},
  {name:"Other",icon:"sparkle",color:"#56646C",subtypes:[]}
];}
const STOCK = ["Full","Half","Low","Almost out","Empty"];
const STOCK_PCT = {"Full":1,"Half":.5,"Low":.25,"Almost out":.1,"Empty":0};
const SORTS = [
  ["smart","Runs out soonest",true],["days","Days left",true],["rating","Rating",true],
  ["name","Name",false],["brand","Brand",false],["category","Category",false],["recent","Recently bought",false]
];

/* ================= state ================= */
function jget(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function jset(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ toast("Storage is full. Remove a few photos, then try again."); return false; } }
let db = jget(KEY) || { products:[], categories:defaultCats(), settings:{} };
if(!Array.isArray(db.products)) db.products=[];
if(!Array.isArray(db.categories)||!db.categories.length) db.categories=defaultCats();
db.settings = db.settings || {};
db.friends = Array.isArray(db.friends) ? db.friends : [];
db.routine = db.routine || { am:[], pm:[], note:"" };
db.profile = db.profile || { name:"", bio:"" };
db.products.forEach(p=>{ if(!Array.isArray(p.pics)) p.pics=[]; });
let AMAZON_TAG = (jget("shelf.cfg")||{}).amazonTag || "";
let lic = jget(LKEY);          // { token, email }
let ent = jget(EKEY) || {};    // cached entitlement from /api/status
const ui = { tab:"shelf", q:"", cat:"All", show:"all", sort: db.settings.sort || "name", view: db.settings.view || "reel", friend:null, sel:null };
function save(){ const ok=jset(KEY, db); if(ok) scheduleSync(); return ok; }

function isPro(){
  if(DEV_PRO) return true;
  return !!(lic && lic.token && ent && ent.pro && (Date.now() - (ent.checkedAt||0)) < 7*864e5);
}
function sortOK(k){ const s=SORTS.find(x=>x[0]===k); return s && (!s[2] || isPro()); }

/* ================= utils ================= */
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return "p_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m? new Date(+m[1],+m[2]-1,+m[3]) : null; }
function fmtDate(d){ return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function fmtLong(ms){ return new Date(ms).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"}); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); }
function download(name, text, type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function getCat(name){ return db.categories.find(c=>c.name===name) || {name:name||"Other",icon:"sparkle",color:"#56646C",subtypes:[]}; }
function icon(key,color,size){ return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="'+color+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:'+color+'">'+(ICONS[key]||ICONS.sparkle)+'</svg>'; }
function thumb(p){ if(p.img) return '<img class="thumb" alt="" src="'+p.img+'">'; return '<span class="thumb" style="background:#EEF0EB;align-items:end;padding-bottom:3px">'+bottleSVG(lookOf(p),level(p).pct,40)+'</span>'; }

/* ================= projection: the core of Shelf ================= */
function lifeDays(p){ const n=parseFloat(p.expAmt); if(!(n>0)) return 0; return ({days:1,weeks:7,months:30.44,years:365.25}[p.expUnit||"months"]||30.44)*n; }
function projection(p){
  if(!isPro()) return null;
  const L=lifeDays(p), d=parseISO(p.lastPurchased); if(!L||!d) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const used=(now-d)/864e5;
  return { pct:clamp(1-used/L,0,1), daysLeft:Math.round(L-used), outDate:new Date(d.getTime()+L*864e5) };
}
function level(p){
  const pr=projection(p), s=(p.stock in STOCK_PCT)?STOCK_PCT[p.stock]:null;
  let pct=null;
  if(pr && s!=null) pct=Math.min(pr.pct,s); else if(pr) pct=pr.pct; else if(s!=null) pct=s;
  let state="unknown";
  if(pct!=null) state = (pr ? (pr.daysLeft<=0 || (s!=null && s<=0.05)) : pct<=0.05) ? "out" : (pct<=0.25 || (pr && pr.daysLeft<=14)) ? "low" : "ok";
  return { pct, state, pr };
}
function stateColor(st){ return st==="out"?"var(--out)":st==="low"?"var(--low)":"var(--ok)"; }
function needsReorder(p){ if(p.active===false) return false; if(p.reorder) return true; const s=level(p).state; return s==="out"||s==="low"; }
function statusText(p, L){
  L=L||level(p); const pr=L.pr;
  if(p.active===false) return ["none","Retired"];
  if(pr){
    if(pr.daysLeft<=0) return ["out","Likely out since "+fmtDate(pr.outDate)];
    if(pr.daysLeft<=13) return [L.state, pr.daysLeft+" day"+(pr.daysLeft===1?"":"s")+" left"];
    if(pr.daysLeft<=60) return [L.state, "About "+Math.round(pr.daysLeft/7)+" weeks left"];
    return [L.state, "Runs out around "+fmtDate(pr.outDate)];
  }
  if(p.stock) return [L.state, p.stock];
  if(!isPro() && p.lastPurchased && p.expAmt) return ["none","Countdown available with Pro"];
  return ["none","No level set"];
}

/* ================= render ================= */
function render(){
  const pb=$("planBtn");
  if(isPro()){ pb.textContent = ent.status==="trialing" ? "Pro trial" : "Pro"; pb.classList.add("pro"); }
  else { pb.textContent="Try Pro"; pb.classList.remove("pro"); }
  if(!sortOK(ui.sort)) ui.sort="name";
  const m=$("main"); m.innerHTML="";
  document.body.classList.toggle("viewing",!!ui.friend);
  document.body.classList.toggle("reelview", !ui.friend && ui.tab==="shelf" && ui.view==="reel" && db.products.length>0);
  if(ui.friend){ renderFriend(m); return; }
  if(!db.products.length && ui.tab==="shelf"){ m.appendChild(emptyState()); if(!db.friends.length) return; }
  else if(db.products.length) m.appendChild(strip(ui.tab==="shelf" && ui.view!=="list"));
  const lowN=db.products.filter(needsReorder).length;
  const tabs=[["shelf","Shelf",db.products.length],["low","Low",lowN],["routine","Routine",""],["friends","Friends",db.friends.length||""]];
  const seg=document.createElement("div"); seg.className="seg"; seg.setAttribute("role","tablist");
  seg.innerHTML=tabs.map(t=>'<button role="tab" class="'+(ui.tab===t[0]?"on":"")+'" aria-selected="'+(ui.tab===t[0])+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+(t[2]!==""?'<span class="n">'+t[2]+'</span>':'')+'</button>').join("");
  m.appendChild(seg);
  if(ui.tab==="low") renderLow(m);
  else if(ui.tab==="routine") renderRoutine(m);
  else if(ui.tab==="friends") renderFriends(m);
  else if(db.products.length) renderShelf(m);
}
function setTab(t){ ui.tab=t; closePeek(); render(); if(t==="friends") refreshFriends(); window.scrollTo(0,0); }

function emptyState(){
  const d=document.createElement("div"); d.className="strip";
  d.innerHTML='<div class="empty" style="padding:6px 2px"><h2>Your shelf is empty.</h2>'+
    '<p>Add the products you use. Shelf shows what\'s running low so you can reorder before you run out.</p>'+
    '<div class="btns"><button class="sbtn primary" onclick="openScan()">Scan a product'+(isPro()?'':'<span class="pro-pill" style="background:#ffffff33;color:#fff">Pro</span>')+'</button>'+
    '<button class="sbtn" onclick="openProduct(null)">Add by hand</button>'+
    '<button class="sbtn" onclick="openImport()">Import a list</button>'+
    '<button class="sbtn" onclick="openAmazon()">Import Amazon orders</button></div>'+
    '<p style="margin-top:16px">Got a link to a friend\'s shelf? <button class="linkbtn" onclick="openAddFriend()">Open it</button></p></div>';
  return d;
}

function strip(compact){
  const act=db.products.filter(p=>p.active!==false).map(p=>({p,L:level(p)}));
  act.sort((a,b)=>((a.L.pct==null?2:a.L.pct)-(b.L.pct==null?2:b.L.pct)));
  const s=document.createElement("section"); s.className="strip"; s.setAttribute("aria-label","Product levels");
  const v=document.createElement("div"); v.className="vials";
  act.forEach(({p,L})=>{
    const b=document.createElement("button"); b.className="vial"+(L.pct==null?" unknown":"");
    const h=56+((p.name||"").length%3)*8; // varied bottle heights read as a real shelf
    const st=statusText(p,L)[1];
    b.setAttribute("aria-label",p.name+": "+st); b.title=p.name+": "+st;
    b.innerHTML=bottleSVG(lookOf(p),L.pct,64);
    b.onclick=()=>openProduct(p.id); v.appendChild(b);
  });
  if(!compact){ s.appendChild(v); const pl=document.createElement("div"); pl.className="plank"; s.appendChild(pl); }
  else s.style.padding="14px 16px";
  const out=act.filter(x=>x.L.state==="out").length, low=act.filter(x=>x.L.state==="low").length,
        ok=act.filter(x=>x.L.state==="ok").length, unk=act.filter(x=>x.L.state==="unknown").length;
  const parts=[];
  if(out) parts.push('<b>'+out+' out</b>');
  if(low) parts.push('<b>'+low+' running low</b>');
  if(ok) parts.push(ok+' stocked');
  if(unk) parts.push(unk+' with no level yet');
  const sm=document.createElement("p"); sm.className="summary";
  sm.innerHTML = parts.length ? joinWords(parts)+"." : "Nothing active on your shelf.";
  s.appendChild(sm);
  return s;
}
function joinWords(a){ return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1]; }

function renderShelf(m){
  const vw=document.createElement("div"); vw.className="views"; vw.setAttribute("role","group"); vw.setAttribute("aria-label","View");
  vw.innerHTML=[["reel","Reel"],["shelf","Shelf"],["wheel","Wheel"],["list","List"]].map(v=>'<button aria-pressed="'+(ui.view===v[0])+'" class="'+(ui.view===v[0]?"on":"")+'" data-v="'+v[0]+'">'+v[1]+'</button>').join("");
  vw.querySelectorAll("button").forEach(b=>b.onclick=()=>{ ui.view=b.dataset.v; db.settings.view=ui.view; jset(KEY,db); closePeek(); render(); });
  m.appendChild(vw);

function fillList(){
  const box=$("plist"); if(!box) return; box.innerHTML="";
  if(ui.cat!=="All" && !db.categories.some(c=>c.name===ui.cat)) ui.cat="All";
  let ps=db.products.slice();
  if(ui.cat!=="All") ps=ps.filter(p=>p.category===ui.cat);
  if(ui.show==="star") ps=ps.filter(p=>p.star&&p.active!==false);
  else if(ui.show==="active") ps=ps.filter(p=>p.active!==false);
  else if(ui.show==="retired") ps=ps.filter(p=>p.active===false);
  const q=ui.q.trim().toLowerCase();
  if(q) ps=ps.filter(p=>[p.name,p.brand,p.actives,p.subtype].some(v=>(v||"").toLowerCase().includes(q)));
  const L=new Map(ps.map(p=>[p.id,level(p)]));
  const pctOf=p=>{ const x=L.get(p.id).pct; return x==null?2:x; };
  const byName=(a,b)=>(a.name||"").localeCompare(b.name||"");
  const off=p=>p.active===false?1:0;
  const S={
    smart:(a,b)=>off(a)-off(b)||(needsReorder(b)-needsReorder(a))||pctOf(a)-pctOf(b)||byName(a,b),
    days:(a,b)=>off(a)-off(b)||((L.get(a.id).pr?L.get(a.id).pr.daysLeft:1e6)-(L.get(b.id).pr?L.get(b.id).pr.daysLeft:1e6))||byName(a,b),
    rating:(a,b)=>(b.rating||0)-(a.rating||0)||byName(a,b),
    name:(a,b)=>off(a)-off(b)||byName(a,b),
    brand:(a,b)=>off(a)-off(b)||(a.brand||"~").localeCompare(b.brand||"~")||byName(a,b),
    category:(a,b)=>off(a)-off(b)||(a.category||"").localeCompare(b.category||"")||(a.subtype||"").localeCompare(b.subtype||"")||byName(a,b),
    recent:(a,b)=>(b.lastPurchased||"").localeCompare(a.lastPurchased||"")||byName(a,b)
  };
  ps.sort(S[ui.sort]||S.name);
  if(!ps.length){ box.innerHTML='<div class="empty">No products match. Try another category or search.</div>'; return; }
  if(ui.view==="reel"){ renderReel(box,ps); return; }
  if(ui.view==="shelf"){ renderShelfVisual(box,ps); return; }
  if(ui.view==="wheel"){ renderWheel(box,ps); return; }
  const list=document.createElement("div"); list.className="list";
  ps.forEach(p=>list.appendChild(prow(p,L.get(p.id))));
  box.appendChild(list);
}
function gaugeHTML(L){
  if(L.pct==null) return '<span class="gauge unknown" aria-hidden="true"></span>';
  return '<span class="gauge" aria-hidden="true"><i style="height:'+Math.round(L.pct*100)+'%;background:'+stateColor(L.state)+'"></i></span>';
}
function prow(p,L){
  const b=document.createElement("button"); b.className="prow"+(p.active===false?" off":"");

    '<span class="pstat '+st[0]+'">'+esc(st[1])+(p.reorder&&p.active!==false?'<span class="flag">Reorder</span>':'')+'</span></span>'+gaugeHTML(L);

function renderLow(m){
  const act=db.products.filter(p=>p.active!==false);
  const rows=act.map(p=>({p,L:level(p)}));
  const out=rows.filter(x=>x.L.state==="out"), low=rows.filter(x=>x.L.state==="low"),
        flagged=rows.filter(x=>x.p.reorder && x.L.state!=="out" && x.L.state!=="low");
  const byPct=(a,b)=>(a.L.pct==null?2:a.L.pct)-(b.L.pct==null?2:b.L.pct);
  const group=(title,note,arr)=>{ if(!arr.length) return;
    const h=document.createElement("h2"); h.className="grp"; h.innerHTML=esc(title)+'<small>'+esc(note)+'</small>'; m.appendChild(h);
    const l=document.createElement("div"); l.className="list"; arr.sort(byPct).forEach(x=>l.appendChild(lrow(x.p,x.L))); m.appendChild(l); };
  group("Out","Reorder now",out);

    const e=document.createElement("div"); e.className="list";
    e.innerHTML='<div class="empty"><h2>Nothing running low.</h2>'+(isPro()
      ? 'Products show up here as their countdown gets close. Add a purchase date and how long each one lasts to start the countdown.'

    t.innerHTML='<b>Stop checking bottles by hand.</b><br>With Pro, Shelf counts down each product from the day you bought it and lists it here before it runs out.'+

/* ---------- images ---------- */
function shrink(file,maxDim,q,asDataUrl){
  return new Promise(res=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ let w=img.naturalWidth||maxDim,h=img.naturalHeight||maxDim; const sc=Math.min(1,maxDim/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
      let out=""; try{ out=cv.toDataURL("image/jpeg",q); }catch(e){} URL.revokeObjectURL(url);
      res(asDataUrl?out:(out?{data:out.split(",")[1],mediaType:"image/jpeg",preview:out}:null)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(asDataUrl?"":null); }; img.src=url; });
}
function shrinkDataUrl(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const sc=Math.min(1,360/Math.max(im.width,im.height));
  const cv=document.createElement("canvas"); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc); cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
  res(cv.toDataURL("image/jpeg",0.62)); }; im.onerror=()=>res(""); im.src=src; }); }

}
function drawShots(){

async function api(path, body, method, headers){
  const opt={ method: method || (body===undefined?"GET":"POST"), headers:Object.assign({},headers||{}) };
  if(body!==undefined){ opt.headers["content-type"]="application/json"; opt.body=JSON.stringify(body); }
  if(lic && lic.token) opt.headers.authorization="Bearer "+lic.token;
  let r; try{ r=await fetch("/api/"+path,opt); }catch(e){ throw new Error("You're offline. Connect and try again."); }
  let d={}; try{ d=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(d.error || ("Something went wrong ("+r.status+")."));
  return d;
}

  f.onchange=()=>{ const file=f.files[0]; f.value=""; if(!file) return; const r=new FileReader(); r.onload=()=>{ $("impText").value=r.result; toast("File loaded. Tap Preview."); }; r.readAsText(file); }; f.click(); }

function splitRow(line){
  if(line.includes("\t")) return line.split("\t").map(c=>c.trim());
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===","){ out.push(cur.trim()); cur=""; } else cur+=ch; } }
  out.push(cur.trim()); return out;
}
function normStock(v){ v=String(v||"").trim().toLowerCase(); return ({full:"Full",half:"Half",low:"Low","almost out":"Almost out",almost:"Almost out",empty:"Empty",out:"Empty"})[v]||""; }
function parseCSV(text){
  const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean); if(!lines.length) return [];
  let rows=lines.map(splitRow);
  const hk=rows[0].map(c=>c.toLowerCase().replace(/[^a-z]/g,""));
  const known=["name","product","brand","category","type","subtype","size","price","cost","wheretobuy","website","url","stock","keyingredients","actives","ingredients","notes","rating"];
  const hdr = hk.filter(c=>known.includes(c)).length>=2 ? hk : null; if(hdr) rows=rows.slice(1);
  const g=(cells,names,pos)=>{ if(hdr){ for(const n of names){ const j=hdr.indexOf(n); if(j>-1) return (cells[j]||"").trim(); } return ""; } return (cells[pos]||"").trim(); };
  return rows.map(c=>({ name:g(c,["name","product"],0), brand:g(c,["brand"],1), category:matchCat(g(c,["category"],2)), subtype:g(c,["type","subtype"],3),
    size:g(c,["size"],4), cost:g(c,["price","cost"],5).replace(/^\$/,""), website:g(c,["wheretobuy","website","url"],6), stock:normStock(g(c,["stock"],7)),
    actives:g(c,["keyingredients","actives","ingredients"],8), notes:g(c,["notes"],9), rating:clamp(parseInt(g(c,["rating"],10),10)||0,0,5) })).filter(x=>x.name);
}

function saveCat(){
  const name=$("cName").value.trim(); if(!name){ toast("Give the category a name."); return; }

function delCat(){
  if(db.categories.length<=1){ toast("Keep at least one category."); return; }
  const used=db.products.filter(p=>p.category===catEdit).length;
  const other=(db.categories.find(c=>c.name==="Other"&&c.name!==catEdit)||db.categories.find(c=>c.name!==catEdit)).name;

function buildSnapshot(){
  const o=(db.share&&db.share.opts)||{retired:false};
  const ps=db.products.filter(p=>o.retired||p.active!==false).slice()
    .sort((a,b)=>((b.star&&b.active!==false)?1:0)-((a.star&&a.active!==false)?1:0) || (b.rating||0)-(a.rating||0));
  const prods=ps.map(p=>({ id:p.id, name:p.name, brand:p.brand||"", category:p.category||"", subtype:p.subtype||"", size:p.size||"",
    rating:p.rating||0, status:p.active===false?"retired":p.star?"star":"active", review:p.review||"", actives:p.actives||"",
    url:normUrl(p.website), shape:lookOf(p).shape, color:lookOf(p).color, img:safeImg(p.img), pics:(p.pics||[]).map(safeImg).filter(Boolean).slice(0,3), since:p.lastPurchased||"" }));
  const snap={ v:1, profile:{name:db.profile.name||"", bio:db.profile.bio||""}, products:prods,
    routine:{am:routineIds("am"),pm:routineIds("pm"),note:db.routine.note||""},
    categories:db.categories.map(c=>({name:c.name,color:c.color,icon:c.icon})) };
  const size=()=>JSON.stringify(snap).length, LIMIT=4.4e6;
  if(size()>LIMIT) prods.forEach(p=>{ if(p.status!=="star") p.pics=[]; });
  if(size()>LIMIT) prods.forEach(p=>{ p.pics=[]; });
  if(size()>LIMIT) prods.forEach(p=>{ if(p.status!=="star") p.img=""; });
  if(size()>LIMIT) prods.forEach(p=>{ p.img=""; });
  return snap;
}

function csvRows(t){
  t=String(t).replace(/^﻿/,""); const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=c; }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
const BEAUTY_RE=/serum|cream|moistur|cleans|toner|essence|sunscreen|\bspf\b|lotion|body wash|shower gel|shampoo|conditioner|leave[- ]in|hair (oil|mask|gel|butter)|\bhair\b|scalp|curl|edge control|mask|exfoli|retinol|niacinamide|hyaluronic|vitamin c|peptide|\blip|mascara|foundation|concealer|primer|blush|bronzer|highlighter|eyeliner|eyeshadow|brow|setting spray|perfume|eau de|fragrance|cologne|deodorant|nail polish|cuticle|supplement|vitamin|collagen|biotin|magnesium|probiotic|omega|gumm|balm|face oil|body oil|scrub|micellar|makeup remover/i;
function guessCat(n){
  const t=n.toLowerCase();
  if(/shampoo|conditioner|leave[- ]in|hair|curl|edge control|scalp/.test(t)) return "Hair";
  if(/supplement|vitamin|collagen|biotin|magnesium|probiotic|omega|gumm|capsule|softgel/.test(t)&&!/vitamin c serum/.test(t)) return "Supplements";
  if(/mascara|foundation|concealer|primer|blush|bronzer|highlighter|eyeliner|eyeshadow|brow|setting spray|lipstick|lip gloss|lip liner/.test(t)) return "Makeup";
  if(/perfume|eau de|fragrance|cologne|body mist/.test(t)) return "Fragrance";
  if(/body wash|shower gel|body lotion|body oil|body butter|deodorant|scrub/.test(t)) return "Body";
  if(BEAUTY_RE.test(t)) return "Skincare";
  return "Other";
}
function cleanName(n){ n=String(n||"").replace(/\s+/g," ").trim(); const cut=n.search(/ [|–-] |, (?=.{0,200}$)/); if(cut>18) n=n.slice(0,cut); return n.length>90?n.slice(0,88).trim()+"…":n; }
function toISO(v){ const d=new Date(v); if(isNaN(d)) return ""; return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
let amz=[], amzAll=false;
function openAmazon(){
  openSheet('<h2 id="sheetTitle">Import Amazon orders</h2>'+
    '<p class="lead">Amazon doesn\'t let apps read your orders directly, but it gives you a file of your order history. Shelf reads it on this device; the file is never uploaded.</p>'+
    '<ol style="margin:0 0 6px;padding-left:20px;color:var(--ink)"><li>On Amazon, open <b>Request Your Data</b> (search "request my data" in Amazon\'s help) and choose <b>Your Orders</b>.</li>'+
    '<li>When Amazon emails you, download and unzip the file.</li>'+

function amzFile(){
  const f=$("fileAny"); f.accept=".csv,text/csv"; f.multiple=false; f.removeAttribute("capture");
  f.onchange=()=>{ const file=f.files[0]; f.value=""; if(!file) return; const r=new FileReader();
    r.onload=()=>{ const out=parseAmazon(r.result); if(out.error){ const s=$("amzStatus"); s.className="status err"; s.textContent=out.error; return; } amz=out.items; amzAll=false; amzPreview(); };
    r.readAsText(file); };
  f.click();

function parseAmazon(text){
  const rows=csvRows(text); if(rows.length<2) return {error:"That file is empty."};
  const h=rows[0].map(x=>String(x).trim().toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=h.indexOf(n); if(i>-1) return i; } return -1; };
  const iName=col("product name","title"), iDate=col("order date"), iAsin=col("asin","asin/isbn"), iStatus=col("order status");
  if(iName<0||iDate<0) return {error:"This isn't an Amazon order history file. Look for Retail.OrderHistory.1.csv in the download."};
  const map=new Map();
  rows.slice(1).forEach(r=>{
    const name=String(r[iName]||"").trim(); if(!name) return;
    if(iStatus>-1 && /cancel/i.test(r[iStatus]||"")) return;
    const asin=iAsin>-1?String(r[iAsin]||"").trim().toUpperCase():""; const date=toISO(r[iDate]);
    const key=/^[A-Z0-9]{10}$/.test(asin)?asin:name.toLowerCase();
    const prev=map.get(key);
    if(prev){ prev.times++; if(date>prev.date) prev.date=date; }
    else map.set(key,{ key, asin:/^[A-Z0-9]{10}$/.test(asin)?asin:"", full:name, name:cleanName(name), date, times:1, beauty:BEAUTY_RE.test(name), cat:guessCat(name) });
  });
  const have=new Set(db.products.map(p=>(p.website||"").match(/\/dp\/([A-Z0-9]{10})/)?RegExp.$1:p.name.toLowerCase()));
  const items=[...map.values()].filter(x=>!have.has(x.asin||x.name.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));
  if(!items.length) return {error:"No new products found in that file."};
  return {items};
}

const wheel={rot:0, n:0, step:0, ps:[], spinning:false, disc:null, wrap:null};
const REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function mixHex(a,b,t){ const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);
  const m=(s)=>Math.round(((A>>s)&255)*(1-t)+((B>>s)&255)*t); return "rgb("+m(16)+","+m(8)+","+m(0)+")"; }
function renderWheel(box, ps){
  const list=ps.filter(p=>p.active!==false).slice(0,24);
  if(!list.length){ box.innerHTML='<div class="empty">No products in use to spin. Change the filters above.</div>'; return; }
  const n=list.length, step=360/n;
  const keep = ui.sel ? list.findIndex(p=>p.id===ui.sel) : -1;
  Object.assign(wheel,{ps:list,n,step,spinning:false});
  if(keep>-1) wheel.rot=-keep*step; else wheel.rot=Math.round(wheel.rot/step)*step;
  const segs=list.map((p,i)=>mixHex(lookOf(p).color,"#FBFAF6",i%2?.8:.68)+" "+(i*step)+"deg "+((i+1)*step)+"deg").join(",");
  const size = n<=8?21:n<=14?17:13;
  const wrap=document.createElement("div"); wrap.className="wheel-wrap"; wrap.style.setProperty("--bh",size+"cqw");
  let bulbs=""; for(let i=0;i<20;i++){ const a=i*18; bulbs+='<span class="bulb" style="transform:rotate('+a+'deg) translateY(calc(-50cqw + 7px))"></span>'; }
  wrap.innerHTML='<div class="rim">'+bulbs+'</div><div class="wheel" style="background:conic-gradient(from '+(-step/2)+'deg,'+segs+');transform:rotate('+wheel.rot+'deg)">'+
    list.map((p,i)=>{ const L=level(p); return '<div class="wb" style="transform:rotate('+(i*step)+'deg) translateY(-31cqw)"><button class="wbb" data-i="'+i+'" aria-label="'+esc(p.name)+'">'+bottleSVG(lookOf(p),L.pct,100)+'</button></div>'; }).join("")+
    '</div><div class="pointer" aria-hidden="true"></div><button class="hub" aria-label="Spin the wheel">Spin</button>';
  box.appendChild(wrap);
  const ctl=document.createElement("div"); ctl.className="wctl";
  ctl.innerHTML='<button class="sbtn" aria-label="Previous product">‹ Prev</button><span class="hint" style="margin:0">Drag to turn. Can\'t decide? Spin.</span><button class="sbtn" aria-label="Next product">Next ›</button>';
  box.appendChild(ctl);
  if(ps.filter(p=>p.active!==false).length>24){ const t=document.createElement("p"); t.className="cap-note"; t.style.textAlign="center"; t.textContent="Showing 24 products. Use the filters above to choose which."; box.appendChild(t); }
  wheel.wrap=wrap; wheel.disc=wrap.querySelector(".wheel");
  wrap.querySelector(".hub").onclick=spinWheel;
  const [prev,,next]=ctl.children; prev.onclick=()=>nudgeWheel(1); next.onclick=()=>nudgeWheel(-1);
  wrap.querySelectorAll(".wbb").forEach(b=>b.onclick=e=>{ if(e.detail===0) turnTo(+b.dataset.i); });
  bindWheelDrag(wrap);
}
function setRot(r,ms,ease){ const d=wheel.disc; if(!d) return; d.style.transition = ms ? "transform "+ms+"ms "+(ease||"cubic-bezier(.2,.8,.3,1)") : "none"; d.style.transform="rotate("+r+"deg)"; wheel.rot=r; }
function idxAtTop(){ return ((Math.round(-wheel.rot/wheel.step)%wheel.n)+wheel.n)%wheel.n; }
function landAfter(ms){ wheel.spinning=true; closePeek(); setTimeout(()=>{ wheel.spinning=false; wheel.wrap&&wheel.wrap.classList.remove("spinning"); const p=wheel.ps[idxAtTop()]; if(p){ openPeek(p); if(navigator.vibrate) navigator.vibrate(12); } }, ms+40); }
function spinWheel(){
  if(wheel.spinning||!wheel.n) return;
  let i=Math.floor(Math.random()*wheel.n); if(wheel.n>1&&i===idxAtTop()) i=(i+1)%wheel.n;
  const from=wheel.rot, base=(((-i*wheel.step-from)%360)+360)%360, target=from+(REDUCED?0:360*4)+base;
  const ms=REDUCED?0:4200;
  wheel.wrap.classList.add("spinning");
  setRot(target,ms,"cubic-bezier(.12,.62,.08,1)"); landAfter(ms);
}
function turnTo(i){ if(wheel.spinning) return; let d=((-i*wheel.step-wheel.rot)%360+540)%360-180; const ms=REDUCED?0:520; setRot(wheel.rot+d,ms); landAfter(ms); }
function nudgeWheel(dir){ if(wheel.spinning) return; const ms=REDUCED?0:360; setRot(Math.round(wheel.rot/wheel.step)*wheel.step+dir*wheel.step,ms); landAfter(ms); }
function bindWheelDrag(wrap){
  let drag=null;
  const ang=e=>{ const r=wrap.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI; };
  wrap.addEventListener("pointerdown",e=>{ if(wheel.spinning||e.target.closest(".hub")) return;
    drag={a:ang(e), t:performance.now(), v:0, moved:0, target:e.target}; wrap.setPointerCapture(e.pointerId); setRot(wheel.rot,0); });
  wrap.addEventListener("pointermove",e=>{ if(!drag) return; const a=ang(e); let d=a-drag.a; d=((d+540)%360)-180;
    const now=performance.now(); drag.v = d/Math.max(1,now-drag.t); drag.t=now; drag.a=a; drag.moved+=Math.abs(d); setRot(wheel.rot+d,0); });
  const end=e=>{ if(!drag) return; const dr=drag; drag=null;
    if(dr.moved<4){ const b=dr.target.closest&&dr.target.closest(".wbb"); if(b) turnTo(+b.dataset.i); return; }
    const extra=REDUCED?0:Math.max(-900,Math.min(900,dr.v*520));
    const target=Math.round((wheel.rot+extra)/wheel.step)*wheel.step, ms=REDUCED?0:Math.min(1800,320+Math.abs(extra)*1.6);
    if(Math.abs(extra)>120) wrap.classList.add("spinning");
    setRot(target,ms,"cubic-bezier(.15,.7,.2,1)"); landAfter(ms); };
  wrap.addEventListener("pointerup",end); wrap.addEventListener("pointercancel",end);
}

/* ================= look picker (editor) ================= */
function liveDraft(){ const g=id=>$(id)?$(id).value:""; return Object.assign({},draft,{name:g("dName")||draft.name, category:g("dCat")||draft.category, subtype:g("dSub")}); }
function drawLook(){
  const box=$("dLook"); if(!box) return;
  const lk=lookOf(liveDraft());
  $("dLookPrev").innerHTML=bottleSVG(lk,0.7,96);
  $("dShapes").innerHTML=Object.entries(SHAPES).map(([k,S])=>'<button type="button" class="ipick'+(k===lk.shape?" on":"")+'" aria-label="'+S.label+'" aria-pressed="'+(k===lk.shape)+'" data-k="'+k+'">'+bottleSVG({shape:k,color:lk.color},0.7,36)+'</button>').join("");
  $("dColors").innerHTML=SWATCHES.map(c=>'<button type="button" class="cpick'+(c===lk.color?" on":"")+'" aria-label="Color '+c+'" aria-pressed="'+(c===lk.color)+'" style="background:'+c+'" data-c="'+c+'"></button>').join("");
  $("dShapes").querySelectorAll("button").forEach(b=>b.onclick=()=>{ draft.shape=b.dataset.k; drawLook(); });
  $("dColors").querySelectorAll("button").forEach(b=>b.onclick=()=>{ draft.color=b.dataset.c; drawLook(); });
}

/* ================= reel: bottles mounted on the side, details on the left ================= */
const reel={ps:[], idx:-1, track:null, info:null, raf:0};
function renderReel(box, ps){
  reel.ps=ps; reel.idx=-1;
  const w=document.createElement("div"); w.className="reel";
  w.innerHTML='<div class="reel-info" aria-live="polite"></div>'+
    '<div class="reel-track" tabindex="0" role="listbox" aria-label="Your products. Scroll to browse."><div class="reel-pad"></div>'+
    ps.map((p,i)=>{ const L=level(p), st=p.active===false?"off":L.state;
      return '<button class="ri'+(p.active===false?" off":"")+'" role="option" data-i="'+i+'" aria-label="'+esc(p.name)+'">'+
        (st==="low"||st==="out"?'<span class="rwarn '+st+'" aria-hidden="true"></span>':'')+
        '<span class="rb">'+bottleSVG(lookOf(p),L.pct,96)+'</span></button>'; }).join("")+
    '<div class="reel-pad"></div></div><div class="payline" aria-hidden="true"></div>';
  box.appendChild(w);
  reel.track=w.querySelector(".reel-track"); reel.info=w.querySelector(".reel-info");
  reel.track.addEventListener("scroll",()=>{ if(!reel.raf) reel.raf=requestAnimationFrame(reelFrame); },{passive:true});
  reel.track.querySelectorAll(".ri").forEach(b=>b.onclick=()=>centerItem(+b.dataset.i,true));
  reel.track.addEventListener("keydown",e=>{ if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); centerItem(Math.max(0,Math.min(reel.ps.length-1,reel.idx+(e.key==="ArrowDown"?1:-1))),true); } });
  const start=Math.max(0,ps.findIndex(p=>p.id===ui.sel));
  requestAnimationFrame(()=>{ centerItem(start,false); reelFrame(); });
}
function centerItem(i,smooth){ const t=reel.track, el=t&&t.querySelectorAll(".ri")[i]; if(!el) return;
  t.scrollTo({top:el.offsetTop+el.offsetHeight/2-t.clientHeight/2, behavior:smooth&&!REDUCED?"smooth":"auto"}); }
function reelFrame(){
  reel.raf=0; const t=reel.track; if(!t||!t.isConnected) return;
  const mid=t.scrollTop+t.clientHeight/2; let best=0, bd=1e9;
  t.querySelectorAll(".ri").forEach((el,i)=>{
    const d=(el.offsetTop+el.offsetHeight/2-mid)/el.offsetHeight, a=Math.min(Math.abs(d),4);
    if(Math.abs(d)<bd){ bd=Math.abs(d); best=i; }
    el.style.transform="translateX("+(a*a*1.5+a*4).toFixed(1)+"px) rotateX("+Math.max(-55,Math.min(55,-d*14)).toFixed(1)+"deg) scale("+(1-a*.06).toFixed(3)+")";
    el.style.opacity=String(Math.max(.22,1-a*.2));
  });
  if(best!==reel.idx){
    const dir=best>reel.idx?1:-1, first=reel.idx<0; reel.idx=best;
    t.querySelectorAll(".ri").forEach((el,i)=>{ el.classList.toggle("on",i===best); el.setAttribute("aria-selected",String(i===best)); });
    showReelInfo(reel.ps[best], first?0:dir);
    if(!first&&navigator.vibrate) navigator.vibrate(3);
  }
}
function showReelInfo(p, dir){
  ui.sel=p.id; const L=level(p), st=statusText(p,L), url=tagUrl(p.website);
  const pct=L.pct==null?null:Math.round(L.pct*100);
  reel.info.innerHTML='<div class="rcard '+(dir>0?"slot-up":dir<0?"slot-down":"slot-in")+'">'+
    '<div class="rhero">'+bottleSVG(lookOf(p),L.pct,112)+'</div>'+
    (p.star&&p.active!==false?'<span class="star-b" style="margin:10px 0 0">★ Superstar</span>':'')+
    '<h2 class="rname">'+esc(p.name)+'</h2>'+
    '<span class="pbrand">'+[p.brand,p.subtype||p.category].filter(Boolean).map(esc).join(", ")+'</span>'+
    '<span class="pstat '+st[0]+'">'+esc(st[1])+'</span>'+
    (pct!=null?'<div class="meter" role="img" aria-label="'+pct+'% left"><i style="width:'+pct+'%;background:'+stateColor(L.state)+'"></i></div>':'')+
    (p.rating?'<p class="pstars" aria-label="'+p.rating+' of 5">'+starsText(p.rating)+'</p>':'')+
    (p.review?'<p class="review rrev">'+esc(p.review)+'</p>':'')+
    '<div class="rowbtns"><button class="sbtn" onclick="openProduct(\''+p.id+'\')">Edit</button>'+
      (needsReorder(p)||p.stock==="Empty"?'<button class="sbtn primary" onclick="markReordered(\''+p.id+'\')">Reordered</button>':'')+
      (url?'<a class="sbtn" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" href="'+esc(url)+'">Shop</a>':'')+'</div>'+
    '<p class="rpos">'+(reel.idx+1)+' of '+reel.ps.length+'</p></div>';
}
window.addEventListener("resize",()=>{ if(reel.track&&reel.track.isConnected&&!reel.raf) reel.raf=requestAnimationFrame(reelFrame); });

/* ================= boot ================= */
render();
handleReturn().then(()=>{ if(lic && (!ent.checkedAt || Date.now()-ent.checkedAt > 6*3600e3)) refreshEnt(); });
api("config").then(d=>{ AMAZON_TAG=d.amazonTag||""; jset("shelf.cfg",{amazonTag:AMAZON_TAG}); }).catch(()=>{});
if(SHARE_PATH) openFriend(SHARE_PATH, true);
</script>
